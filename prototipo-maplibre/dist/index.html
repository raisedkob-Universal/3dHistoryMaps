<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Europa · Prueba MapLibre</title>
  <link rel="stylesheet" href="./maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="./atlas.css?v=15">
</head>
<body data-mapa="1.12">
  <main id="mapa" aria-label="Mapa de Europa con relieve"></main>
  <header><small>ATLAS HISTÓRICO 3D</small><h1>Europa</h1><span id="nombre-mapa"></span></header>
  <nav class="vistas" aria-label="Vistas del mapa">
    <button id="perspectiva" type="button" aria-pressed="true" disabled>Perspectiva</button>
    <button id="cenital" type="button" aria-pressed="false" disabled>Cenital</button>
  </nav>
  <details class="leyenda" id="leyenda">
    <summary>Leyenda</summary>
    <div id="simbolos" class="simbolos"></div>
  </details>
  <details class="hitos-mapa">
    <summary>Hitos históricos</summary>
    <div class="hitos-contenido">
      <p id="introduccion-hitos"></p>
      <ol id="notas-mapa"></ol>
    </div>
  </details>
  <details class="cronologia" aria-labelledby="titulo-cronologia">
    <summary id="titulo-cronologia">Cronología</summary>
    <div class="cronologia-scroll"><div id="franjas" class="franjas"></div></div>
  </details>
  <section id="ficha" class="ficha" aria-labelledby="titulo-ficha" hidden>
    <button id="cerrar-ficha" type="button" aria-label="Cerrar ficha">×</button>
    <h2 id="titulo-ficha"></h2>
    <p id="texto-ficha"></p>
    <p id="enlace-ficha"></p>
  </section>
  <dialog class="bibliografia" id="bibliografia" aria-labelledby="titulo-bibliografia">
    <form method="dialog"><button type="submit" aria-label="Cerrar bibliografía">×</button></form>
    <div class="bibliografia-contenido">
      <h2 id="titulo-bibliografia">Bibliografía</h2>
      <div id="fuentes-mapa"></div>
    </div>
  </dialog>
  <p id="estado" role="status">Cargando el terreno…</p>
  <script src="./maplibre/maplibre-gl.js"></script>
  <script src="./atlas.js?v=7"></script>
  <script src="./historia.js?v=9"></script>
</body>
</html>
